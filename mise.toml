[tools]
java = "temurin-21"   # JDK for Gradle/AGP
gradle = "9.8.0"      # only used to bootstrap the wrapper; builds use ./gradlew
python = "3.14"       # tools/inspect_mtz.py (stdlib only)
uv = "latest"         # tools/glyph_lab (numpy + pillow via `uv run --with`)

[env]
ANDROID_HOME = "{{env.HOME}}/Android/Sdk"
_.path = [
  "{{env.HOME}}/Android/Sdk/cmdline-tools/latest/bin",
  "{{env.HOME}}/Android/Sdk/platform-tools",
]

[tasks.bootstrap]
description = "Generate the Gradle wrapper and local.properties"
run = [
  "gradle wrapper --gradle-version 9.8.0 --distribution-type bin --no-validate-url",
  "echo \"sdk.dir=$ANDROID_HOME\" > local.properties",
]

[tasks.build]
run = "./gradlew assembleDebug"

[tasks.test]
run = "./gradlew testDebugUnitTest"

[tasks.install]
run = "./gradlew installDebug"

[tasks.run]
description = "Install and launch on the connected device"
depends = ["install"]
run = "adb shell am start -n dev.abhay.hypericon/.MainActivity"

[tasks.glyph-lab]
description = "Run the glyph prototype: mise run glyph-lab <dump> <out> [packages...]"
run = "uv run --quiet --with numpy --with pillow python tools/glyph_lab/simple.py"

[tasks.inspect]
run = "python tools/inspect_mtz.py"
